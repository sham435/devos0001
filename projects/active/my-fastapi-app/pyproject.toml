[project]
name = "my-fastapi-app"
version = "0.1.0"
description = "Production-ready FastAPI REST API"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.115.0",
    "uvicorn[standard]==0.30.6",
    "pydantic==2.8.0",
    "pydantic-settings==2.4.0",
    "sqlalchemy==2.0.35",
    "asyncpg==0.29.0",
    "alembic==1.13.2",
    "python-jose[cryptography]==3.3.0",
    "passlib[bcrypt]==1.7.4",
    "httpx==0.27.0",
    "redis[asyncio]==5.0.8",
    "celery==5.4.0",
    "structlog==24.2.0",
    "slowapi==0.1.9",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.0",
    "pytest-asyncio==0.23.0",
    "pytest-cov==5.0.0",
    "factory-boy==3.3.0",
    "ruff==0.6.0",
    "black==24.8.0",
    "mypy==1.11.0",
    "httpx==0.27.0",
]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "ARG"]

[tool.mypy]
strict = true
python_version = "3.12"
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --cov=app --cov-report=term-missing"

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
